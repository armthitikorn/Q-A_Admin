<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หัวหน้า - โหมดสด</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');
*{box-sizing:border-box}
body{font-family:'Sarabun',sans-serif;margin:0;padding:20px;background:#f4f7f6;color:#222}
.wrap{max-width:1000px;margin:0 auto;text-align:center}
h1{color:#d9534f;font-size:26px;margin:6px 0 14px}
button,select,input{font:inherit}
button{padding:14px 28px;font-size:22px;font-weight:700;border:none;border-radius:10px;background:#337ab7;color:#fff;cursor:pointer;margin:8px}
button.g{background:#5cb85c}button.r{background:#d9534f}button.x{background:#999}
select,input{padding:12px;font-size:18px;border:1px solid #ddd;border-radius:8px}
.panel{background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.08);padding:26px;margin:14px auto}
.code{font-size:96px;font-weight:700;letter-spacing:12px;color:#d9534f;line-height:1.1}
.link{font-size:20px;color:#337ab7;word-break:break-all;margin:8px 0}
.stmt{font-size:34px;line-height:1.5;margin:14px 0 22px;text-align:left}
.timer{font-size:72px;font-weight:700;color:#d9534f}
.cnt{font-size:24px;color:#555}
.big{font-size:56px;font-weight:700}
.ok{color:#2e8b57}.bad{color:#d9534f}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.box{flex:1;min-width:130px;background:#f4f7f6;border-radius:10px;padding:14px;font-size:22px}
table{width:100%;border-collapse:collapse;font-size:22px;text-align:left}
td,th{padding:10px;border-bottom:1px solid #eee}
.login{max-width:360px;margin:12vh auto;display:grid;gap:10px}
.err{color:#d9534f}
.hide{display:none}
</style>
</head>
<body>
<div id="loginView" class="panel login">
  <h1>เข้าสู่ระบบหัวหน้า</h1>
  <input id="em" placeholder="อีเมล" autocomplete="username">
  <input id="pw" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
  <div id="loginErr" class="err"></div>
  <button class="g" id="loginBtn">เข้าสู่ระบบ</button>
</div>

<div id="appView" class="wrap hide">
  <div id="setup" class="panel">
    <h1>เปิดห้องโหมดสด</h1>
    <p>ทีมที่เล่น: <select id="team">
      <option value="tele">ทีมเทเล</option><option value="agent">ทีมเอเจน</option>
      <option value="all">ทุกทีม (เฉพาะโจทย์ที่ตั้งเป็นทุกทีม)</option></select></p>
    <p>เวลาต่อข้อ: <input id="secs" type="number" min="5" max="120" value="20" style="width:90px"> วินาที</p>
    <div id="setupErr" class="err"></div>
    <button class="g" id="createBtn">สร้างห้อง</button>
    <button class="x" id="outBtn">ออกจากระบบ</button>
  </div>
  <div id="screen" class="panel hide"></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient(
  'https://wzwyotzzxycqfwercakh.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6d3lvdHp6eHljcWZ3ZXJjYWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwNTg3MTMsImV4cCI6MjA3MjYzNDcxM30.lgiAf9oBUqsaWGb3u_80wuoKAODQHE_lIBxpGumhrno'
);
const $ = id => document.getElementById(id);
let game = null, qs = [], idx = -1, status = 'lobby', deadline = 0, players = 0, answered = 0, dist = null;

// ---------- ล็อกอิน ----------
const gate = on => { $('loginView').classList.toggle('hide', on); $('appView').classList.toggle('hide', !on); };
$('loginBtn').onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
  if (error) return $('loginErr').textContent = 'เข้าสู่ระบบไม่สำเร็จ';
  gate(true);
};
$('outBtn').onclick = async () => { await sb.auth.signOut(); gate(false); };
sb.auth.getSession().then(({ data }) => gate(!!data.session)).catch(() => gate(false));

// ---------- สร้างห้อง ----------
$('createBtn').onclick = async () => {
  $('setupErr').textContent = '';
  const team = $('team').value, secs = parseInt($('secs').value, 10) || 20;
  const teams = team === 'all' ? ['all'] : ['all', team];
  const q = await sb.from('wc_questions').select('*').eq('is_active', true).in('team', teams)
    .order('position').order('team');
  if (q.error) return $('setupErr').textContent = 'โหลดโจทย์ไม่สำเร็จ: ' + q.error.message;
  if (!q.data.length) return $('setupErr').textContent = 'ยังไม่มีโจทย์ที่เปิดใช้งาน';
  const g = await sb.rpc('wc_live_create', { p_team: team, p_seconds: secs });
  if (g.error) return $('setupErr').textContent = 'สร้างห้องไม่สำเร็จ: ' + g.error.message;
  qs = q.data; game = { id: g.data[0].gid, code: g.data[0].gcode }; idx = -1; status = 'lobby';
  $('setup').classList.add('hide'); $('screen').classList.remove('hide');
  sb.channel('host-' + game.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'wc_live_players', filter: 'game_id=eq.' + game.id }, refresh)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'wc_live_answers', filter: 'game_id=eq.' + game.id }, refresh)
    .subscribe();
  setInterval(refresh, 3000);
  render();
};

// ---------- นับจำนวนสด ----------
async function refresh() {
  if (!game) return;
  const p = await sb.from('wc_live_players').select('id', { count: 'exact', head: true }).eq('game_id', game.id);
  if (p.count != null) players = p.count;
  if (status === 'question' || status === 'closed') {
    const a = await sb.from('wc_live_answers').select('id', { count: 'exact', head: true })
      .eq('game_id', game.id).eq('question_id', qs[idx].id);
    if (a.count != null) answered = a.count;
  }
  if ($('cntP')) $('cntP').textContent = players;
  if ($('cntA')) $('cntA').textContent = answered;
}

// ---------- ควบคุมเกม ----------
const setState = (s, qid, i) => sb.rpc('wc_live_set', { p_game: game.id, p_status: s, p_question: qid || null, p_idx: i ?? -1 });

async function openQ(i) {
  const r = await setState('question', qs[i].id, i);
  if (r.error) return alert('เปิดข้อไม่สำเร็จ: ' + r.error.message);
  idx = i; status = 'question'; answered = 0; dist = null;
  deadline = Date.now() + (parseInt($('secs').value, 10) || 20) * 1000;
  render();
}
async function closeQ() {
  if (status !== 'question') return;
  status = 'closed'; render();
  await setState('closed');
  refresh();
}
async function reveal() {
  const r = await setState('revealed');
  if (r.error) return alert('เฉลยไม่สำเร็จ: ' + r.error.message);
  const a = await sb.from('wc_live_answers').select('is_correct').eq('game_id', game.id).eq('question_id', qs[idx].id);
  const c = (a.data || []).filter(x => x.is_correct).length, w = (a.data || []).length - c;
  dist = { c, w, n: Math.max(0, players - c - w) };
  status = 'revealed'; render();
}
async function endGame() {
  await setState('ended');
  const r = await sb.from('wc_live_players').select('*').eq('game_id', game.id)
    .order('score', { ascending: false }).order('warnings', { ascending: true });
  dist = r.data || []; status = 'ended'; render();
}
setInterval(() => {
  if (status !== 'question') return;
  const left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  if ($('left')) $('left').textContent = left;
  if (left <= 0) closeQ();
}, 250);

// ---------- แสดงผลบนจอ ----------
function btn(text, cls, fn) { const b = document.createElement('button'); b.textContent = text; b.className = cls; b.onclick = fn; return b; }
function render() {
  const s = $('screen'); s.innerHTML = '';
  const q = qs[idx], last = idx === qs.length - 1;
  if (status === 'lobby') {
    const link = new URL('wc-live-player.html', location.href).href + '?code=' + game.code;
    s.innerHTML = '<h1>เข้าร่วมกิจกรรม</h1><div>ใส่รหัสห้อง</div><div class="code" id="code"></div>' +
      '<div class="link" id="link"></div><div class="cnt">ผู้เข้าร่วม <b id="cntP">0</b> คน</div>';
    $('code').textContent = game.code; $('link').textContent = link;
    s.append(btn('เริ่มข้อ 1', 'g', () => openQ(0)));
  } else if (status === 'question' || status === 'closed') {
    s.innerHTML = '<div class="cnt">ข้อ ' + (idx + 1) + ' / ' + qs.length + '</div><div class="stmt" id="stmt"></div>' +
      '<div class="timer" id="left"></div><div class="cnt">ตอบแล้ว <b id="cntA">0</b> / <b id="cntP">0</b> คน</div>';
    $('stmt').textContent = q.statement;
    if (status === 'closed') { $('left').textContent = 'หมดเวลา'; s.append(btn('เฉลย', 'g', reveal)); }
    else s.append(btn('ปิดรับคำตอบ', 'r', closeQ));
    $('cntP').textContent = players; $('cntA').textContent = answered;
  } else if (status === 'revealed') {
    s.innerHTML = '<div class="stmt" id="stmt"></div><div>เฉลย</div>' +
      '<div class="big ' + (q.correct_answer ? 'ok' : 'bad') + '">' + (q.correct_answer ? 'ถูก' : 'ผิด') + '</div>' +
      '<div class="row"><div class="box ok">ตอบถูก<br><b>' + dist.c + '</b></div>' +
      '<div class="box bad">ตอบผิด (ใบวอร์นิ่ง)<br><b>' + dist.w + '</b></div>' +
      '<div class="box">ไม่ได้ตอบ<br><b>' + dist.n + '</b></div></div>';
    $('stmt').textContent = q.statement;
    s.append(last ? btn('สรุปอันดับ', 'g', endGame) : btn('ข้อถัดไป', 'g', () => openQ(idx + 1)));
  } else {
    s.innerHTML = '<h1>สรุปผลกิจกรรม</h1><div class="cnt">ผู้เข้าร่วม ' + dist.length + ' คน</div>' +
      '<table><tr><th>#</th><th>ชื่อ</th><th>สังกัด</th><th>คะแนน</th><th>ใบวอร์นิ่ง</th></tr></table>';
    const t = s.querySelector('table');
    dist.slice(0, 10).forEach((p, i) => {
      const tr = document.createElement('tr');
      [i + 1, p.employee_name, p.employee_group || '-', p.score, p.warnings].forEach(v => {
        const td = document.createElement('td'); td.textContent = v; tr.append(td);
      });
      t.append(tr);
    });
    s.append(btn('สร้างห้องใหม่', 'x', () => location.reload()));
  }
  refresh();
}
</script>
</body>
</html>
